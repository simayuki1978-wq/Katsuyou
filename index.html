<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本語活用マスター</title>
    <style>
        :root {
            --primary: #58cc02; --dark-green: #46a302; --bg: #ffffff; --text: #4b4b4b;
            --card-bg: #ffffff; --border: #e5e5e5; --accent: #1cb0f6;
        }
        [data-theme="dark"] {
            --primary: #58cc02; --dark-green: #46a302; --bg: #131f24; --text: #eeeeee;
            --card-bg: #202f36; --border: #3c4d54; --accent: #1cb0f6;
        }

        body {
            margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f0f0; color: var(--text);
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; transition: background-color 0.3s, color 0.3s;
        }

        #app {
            width: 100%; max-width: 500px; min-height: 100vh;
            display: flex; flex-direction: column;
            background-color: var(--bg); color: var(--text);
            transition: background-color 0.3s, color 0.3s;
            box-shadow: 0 0 30px rgba(0,0,0,0.12);
        }

        .header {
            padding: 15px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--border);
            background-color: var(--bg); color: var(--text);
            flex-shrink: 0;
        }
        .header-title { font-weight: bold; font-size: 16px; color: var(--text); }

        .screen {
            display: none; flex-direction: column; flex: 1;
            padding: 16px; box-sizing: border-box; overflow-y: auto;
            background-color: var(--bg); color: var(--text);
        }
        .active { display: flex; }

        /* ボタン */
        .btn {
            background: var(--primary); color: white; border: none; border-bottom: 4px solid var(--dark-green);
            padding: 15px; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer;
            margin-bottom: 15px; text-align: center; display: block; width: 100%; box-sizing: border-box;
        }
        .btn:active { transform: translateY(2px); border-bottom-width: 2px; }
        .btn-blue { background: var(--accent); border-bottom-color: #1899d6; }
        .btn-sub {
            background: var(--card-bg); border: 2px solid var(--border); border-bottom-width: 2px;
            color: var(--text);
        }

        /* ── 1. 活用システム ── */
        .table-container {
            overflow-x: auto; overflow-y: auto;
            border: 1px solid var(--border); border-radius: 10px; margin-bottom: 15px;
            flex: 1;
        }
        /* 説明列（2列目以降のテキスト）は2〜3行で折り返す */
        table { border-collapse: collapse; width: 100%; }
        th, td {
            border: 1px solid var(--border);
            padding: 5px 5px; text-align: center;
            background-color: var(--card-bg); color: var(--text);
            font-size: 13px;          /* ★字を大きく */
            white-space: normal;      /* ★折り返しON → 列幅が狭くなる */
            word-break: break-all;
            max-width: 70px;          /* ★各列の最大幅を制限 */
            line-height: 1.4;
        }
        th { background-color: var(--primary); color: white; font-weight: bold; white-space: nowrap; }

        /* ── フラッシュカード共通 ── */
        .card-container {
            perspective: 1000px;
            height: 360px;
            margin: 12px 0;
            flex-shrink: 0;
        }
        .card {
            width: 100%; height: 100%; position: relative;
            transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer;
        }
        .card.is-flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 2px solid var(--border); border-radius: 25px;
            background-color: var(--card-bg); color: var(--text);
            padding: 20px; box-sizing: border-box;
            box-shadow: 0 4px 0 var(--border);
            text-align: center; overflow: hidden;
        }
        /* ── 2. 動詞カード ── */
        .verb-front { font-size: clamp(20px, 6vw, 28px); }   /* ★大きく */
        /* 裏面 */
        .card-back {
            transform: rotateY(180deg);
            overflow-y: auto;
            justify-content: flex-start;
            padding-top: 14px;
            font-size: 14px;
        }

        /* 動詞カード裏面テーブル（縦並び） */
        .back-table { width: 100%; border-collapse: collapse; }
        .back-table th {
            background-color: var(--primary); color: white;
            padding: 7px 10px; font-size: 13px; white-space: nowrap;
            border: 1px solid var(--dark-green);
            text-align: left; width: 45%;
        }
        .back-table td {
            padding: 7px 10px; border: 1px solid var(--border);
            font-size: 16px; font-weight: bold; text-align: left;  /* ★大きく */
        }

        /* ── 3. 形容詞カード ── */
        .adj-front { font-size: clamp(20px, 6vw, 28px); }    /* ★大きく */
        .adj-back  { font-size: clamp(16px, 5vw, 22px); justify-content: center; }  /* ★大きく */

        /* ── 4. 例文カード ── */
        .example-front { font-size: clamp(18px, 5.5vw, 26px); }  /* ★大きく */
        .example-back  { font-size: clamp(16px, 5vw, 24px); justify-content: center; } /* ★大きく */

        .card-hint { font-size: 12px; color: #aaa; margin-top: 10px; }

        /* ── 5. クイズ ── */
        #quiz-q-container {
            min-height: 120px; margin-bottom: 6px;   /* ★margin小さく */
            border: 2px solid var(--border); border-radius: 25px;
            background-color: var(--card-bg); color: var(--text);
            display: flex; align-items: center; justify-content: center;
            padding: 16px; box-sizing: border-box; text-align: center;
            box-shadow: 0 4px 0 var(--border); font-size: 18px;
            flex-shrink: 0;
        }
        #quiz-feedback {
            font-weight: bold; font-size: 20px;
            margin: 4px 0; height: 26px; text-align: center;  /* ★margin削減 */
        }
        #quiz-answer-reveal {
            font-size: 15px; color: #ff4b4b;
            margin-bottom: 4px; min-height: 20px;             /* ★margin削減 */
            text-align: center; font-weight: bold;
        }
        .quiz-input {
            width: 100%; padding: 12px; border-radius: 15px; border: 2px solid var(--border);
            margin-bottom: 8px; font-size: 18px; box-sizing: border-box;
            background-color: var(--card-bg); color: var(--text);
        }
        .quiz-input:focus { outline: none; border-color: var(--primary); }

        .nav-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .mode-toggle {
            font-size: 12px; cursor: pointer; padding: 5px 10px;
            border: 1px solid var(--border); border-radius: 10px;
            background-color: var(--card-bg); color: var(--text);
            transition: background-color 0.3s, color 0.3s;
        }
        .error-msg { color: #ff4b4b; text-align: center; padding: 20px; }

        /* ── 6. 動詞エクスプローラー ── */
        .explorer-wrapper {
            display: flex; flex-direction: column; flex: 1;
        }
        .explorer-section-title {
            font-size: 10px; font-weight: 700; letter-spacing: 0.15em;
            color: var(--text); opacity: 0.55; margin-bottom: 10px; text-transform: uppercase;
        }
        .explorer-upper-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px; margin-bottom: 24px;
        }
        .explorer-picker-group { display: flex; flex-direction: column; }
        .explorer-picker-label {
            font-size: 10px; color: var(--text); opacity: 0.6;
            margin-bottom: 4px; font-weight: 500;
            text-overflow: ellipsis; overflow: hidden; white-space: nowrap;
        }
        .explorer-select {
            width: 100%; padding: 12px 14px; font-size: 14px; font-weight: 500;
            background-color: var(--card-bg); border: 2px solid var(--border); border-radius: 12px;
            color: var(--text); outline: none; cursor: pointer; appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%2371717a' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
            background-repeat: no-repeat; background-position: right 12px center; background-size: 12px;
        }
        .explorer-select:focus { border-color: var(--primary); }
        .explorer-lower-layout {
            display: flex; flex-direction: column;
            background-color: var(--card-bg); border: 2px solid var(--border); border-radius: 16px;
            padding: 16px; margin-bottom: 16px;
        }
        .explorer-scroller {
            display: flex; flex-direction: column; gap: 10px;
            overflow-y: auto; max-height: 50vh;
            padding: 2px 2px 4px 2px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
        }
        .explorer-scroller::-webkit-scrollbar { width: 5px; }
        .explorer-scroller::-webkit-scrollbar-track { background: transparent; }
        .explorer-scroller::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        /* 各行：左端に語幹（固定幅・強調）、右側にその活用形ラベルと値を続けて表示。
           視線が「語幹 → 活用形」と自然に左から右へ流れるようにする。 */
        .explorer-card {
            flex-shrink: 0; width: 100%; box-sizing: border-box;
            background-color: var(--bg); border: 1px solid var(--border); border-radius: 10px;
            display: flex; align-items: stretch; overflow: hidden;
        }
        .explorer-card-stem {
            flex-shrink: 0; width: 72px;
            background-color: var(--primary); color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; font-weight: 700; letter-spacing: 0.03em;
            padding: 10px 6px; text-align: center;
        }
        .explorer-card-body {
            flex: 1; min-width: 0;
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            padding: 10px 14px;
        }
        .explorer-card-label {
            font-size: 11px; color: var(--text); opacity: 0.55; font-weight: 600;
            flex-shrink: 0;
        }
        .explorer-card-value { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: 0.02em; text-align: right; }
        .explorer-suffix-part { color: var(--primary); }
        .explorer-error {
            grid-column: 1 / -1; text-align: center; padding: 20px;
            color: #b91c1c; background-color: #fef2f2; border: 1px solid #fecaca;
            border-radius: 12px; font-size: 13px; line-height: 1.6;
        }
        .explorer-loading { grid-column: 1 / -1; text-align: center; padding: 20px; color: var(--text); opacity: 0.6; font-size: 14px; }
    </style>
</head>
<body>
<div id="app">
    <div class="header">
        <span class="header-title" id="screen-title">日本語活用マスター</span>
        <button class="mode-toggle" onclick="toggleDarkMode()">🌙 Dark / Light</button>
    </div>

    <!-- トップ画面 -->
    <div id="top-screen" class="screen active">
        <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
            <button class="btn" onclick="openConjugation()">📋 活用システム</button>
            <button class="btn btn-blue" onclick="openFlashcard('verb')">📘 動詞カード</button>
            <button class="btn btn-blue" onclick="openFlashcard('adj')">📗 形容詞カード</button>
            <button class="btn" style="background:#a560e8; border-color:#8848c8" onclick="openFlashcard('example')">📝 例文カード</button>
            <button class="btn" style="background:#ffc800; border-color:#e5a500; color:#333;" onclick="openQuiz()">🎯 クイズ</button>
            <button class="btn" style="background:#ff9600; border-color:#e58200;" onclick="openExplorer()">🔍 動詞エクスプローラー</button>
        </div>
    </div>

    <!-- 活用表画面 -->
    <div id="table-screen" class="screen">
        <div class="table-container" id="table-content">読み込み中...</div>
        <button class="btn btn-sub" style="flex-shrink:0" onclick="showScreen('top-screen')">← 戻る</button>
    </div>

    <!-- フラッシュカード画面 -->
    <div id="card-screen" class="screen">
        <div style="text-align:center; font-size:13px; color:#aaa;" id="card-progress"></div>
        <div class="card-container">
            <div id="main-card" class="card" onclick="this.classList.toggle('is-flipped')">
                <div class="card-face card-front" id="card-front-content">
                    <span class="card-hint">読み込み中...</span>
                </div>
                <div class="card-face card-back" id="card-back-content"></div>
            </div>
        </div>
        <div class="nav-controls">
            <button class="btn btn-sub" onclick="prevCard()">← まえへ</button>
            <button class="btn btn-sub" onclick="nextCard()">つぎへ →</button>
        </div>
        <button class="btn btn-sub" onclick="showScreen('top-screen')">← トップへ戻る</button>
    </div>

    <!-- クイズ画面 -->
    <div id="quiz-screen" class="screen">
        <div id="quiz-q-container"><div id="quiz-question"></div></div>
        <div id="quiz-feedback"></div>
        <div id="quiz-answer-reveal"></div>
        <input type="text" id="quiz-answer" class="quiz-input" placeholder="答えを入力..."
               onkeydown="if(event.key==='Enter') checkAnswer()">
        <button class="btn" onclick="checkAnswer()">答え合わせ</button>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-sub" style="flex:1" onclick="openConjugation()">📋 活用表</button>
            <button class="btn btn-sub" style="flex:1" onclick="showScreen('top-screen')">← 戻る</button>
        </div>
    </div>

    <!-- 動詞エクスプローラー画面 -->
    <div id="explorer-screen" class="screen">
        <div class="explorer-wrapper">
            <div class="explorer-section-title">動詞プロパティ</div>
            <div id="explorer-pickers-container" class="explorer-upper-grid">
                <div class="explorer-loading">データを読み込み中...</div>
            </div>

            <div class="explorer-section-title">活用形</div>
            <div class="explorer-lower-layout">
                <div id="explorer-cards-scroller" class="explorer-scroller"></div>
            </div>
        </div>
        <button class="btn btn-sub" style="flex-shrink:0" onclick="showScreen('top-screen')">← トップへ戻る</button>
    </div>
</div>

<script>
    const URLS = {
        system:  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTDRPlyoBQrG9wzUadhnR8OY9sxuPhkRRpO_WO0BNs-H_f349__5bK5vN6ZYb3U_w/pub?gid=1804971889&single=true&output=csv",
        verb:    "https://docs.google.com/spreadsheets/d/e/2PACX-1vTDRPlyoBQrG9wzUadhnR8OY9sxuPhkRRpO_WO0BNs-H_f349__5bK5vN6ZYb3U_w/pub?gid=257174721&single=true&output=csv",
        adj:     "https://docs.google.com/spreadsheets/d/e/2PACX-1vTDRPlyoBQrG9wzUadhnR8OY9sxuPhkRRpO_WO0BNs-H_f349__5bK5vN6ZYb3U_w/pub?gid=1428601861&single=true&output=csv",
        example: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTDRPlyoBQrG9wzUadhnR8OY9sxuPhkRRpO_WO0BNs-H_f349__5bK5vN6ZYb3U_w/pub?gid=2070601702&single=true&output=csv",
        explorer: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTDRPlyoBQrG9wzUadhnR8OY9sxuPhkRRpO_WO0BNs-H_f349__5bK5vN6ZYb3U_w/pub?gid=494377810&single=true&output=csv"
    };

    let dataStore = { system: [], verb: [], adj: [], example: [], explorer: [] };
    let currentMode = '';
    let currentIndex = 0;
    let currentQuizItem = null;
    let quizColIdx = 4;
    let quizWaitingNext = false;

    function parseCSV(text) {
        const rows = [];
        let row = [], cell = '', inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            const ch = text[i], next = text[i + 1];
            if (inQuotes) {
                if (ch === '"' && next === '"') { cell += '"'; i++; }
                else if (ch === '"') { inQuotes = false; }
                else { cell += ch; }
            } else {
                if (ch === '"') { inQuotes = true; }
                else if (ch === ',') { row.push(cell.trim()); cell = ''; }
                else if (ch === '\n' || (ch === '\r' && next === '\n')) {
                    if (ch === '\r') i++;
                    row.push(cell.trim()); cell = '';
                    if (row.some(c => c !== '')) rows.push(row);
                    row = [];
                } else if (ch === '\r') {
                    row.push(cell.trim()); cell = '';
                    if (row.some(c => c !== '')) rows.push(row);
                    row = [];
                } else { cell += ch; }
            }
        }
        if (cell !== '' || row.length > 0) {
            row.push(cell.trim());
            if (row.some(c => c !== '')) rows.push(row);
        }
        return rows;
    }

    async function fetchData(key) {
        if (dataStore[key].length > 0) return dataStore[key];
        try {
            const res = await fetch(URLS[key]);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            dataStore[key] = parseCSV(await res.text());
            return dataStore[key];
        } catch (e) {
            console.error(`fetchData(${key}) failed:`, e);
            return [];
        }
    }

    const SCREEN_TITLES = {
        'top-screen':   '日本語活用マスター',
        'table-screen': '📋 活用システム',
        'card-screen':  '📘 フラッシュカード',
        'quiz-screen':  '🎯 クイズ',
        'explorer-screen': '🔍 動詞エクスプローラー'
    };

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('screen-title').innerText = SCREEN_TITLES[id] || id;
    }

    function toggleDarkMode() {
        const html = document.documentElement;
        html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }

    // ── 1. 活用システム ──
    async function openConjugation() {
        showScreen('table-screen');
        const data = await fetchData('system');
        if (data.length === 0) {
            document.getElementById('table-content').innerHTML = '<p class="error-msg">データの読み込みに失敗しました。</p>';
            return;
        }
        const colCount = data[0].filter(c => c !== '').length || 7;
        let html = '<table>';
        data.forEach((row, i) => {
            html += '<tr>';
            for (let j = 0; j < colCount; j++) {
                const cell = (row[j] || '').replace(/\+/g, '<br>+');
                html += i === 0 ? `<th>${cell}</th>` : `<td>${cell}</td>`;
            }
            html += '</tr>';
        });
        document.getElementById('table-content').innerHTML = html + '</table>';
    }

    // ── フラッシュカード共通 ──
    async function openFlashcard(mode) {
        currentMode = mode;
        showScreen('card-screen');
        document.getElementById('card-front-content').innerHTML = '読み込み中...';
        document.getElementById('card-back-content').innerHTML = '';
        const data = await fetchData(mode);
        if (data.length <= 1) {
            document.getElementById('card-front-content').innerHTML = '<span class="error-msg">データがありません</span>';
            return;
        }
        currentIndex = parseInt(localStorage.getItem(`pos_${mode}`)) || 1;
        if (currentIndex >= data.length) currentIndex = 1;
        renderCard();
    }

    function renderCard() {
        const data = dataStore[currentMode];
        if (!data || !data[currentIndex]) {
            document.getElementById('card-front-content').innerHTML = '<span class="error-msg">カードが見つかりません</span>';
            return;
        }
        const row = data[currentIndex];
        document.getElementById('main-card').classList.remove('is-flipped');
        document.getElementById('card-progress').innerText = `${currentIndex} / ${data.length - 1}`;

        const frontEl = document.getElementById('card-front-content');
        const backEl  = document.getElementById('card-back-content');

        // クラスをリセット
        frontEl.className = 'card-face card-front';
        backEl.className  = 'card-face card-back';

        if (currentMode === 'verb') {
            // ── 2. 動詞カード ──
            frontEl.classList.add('verb-front');
            frontEl.innerHTML = row.slice(0, 4).filter(Boolean).join('<br>') + '<br><span class="card-hint">タップで答えを確認</span>';

            // 裏面: E〜L列（index 4〜11）縦並びテーブル
            const headers = data[0];
            let tableHtml = '<table class="back-table">';
            for (let i = 4; i <= 11 && i < headers.length; i++) {
                if (!headers[i]) continue;
                tableHtml += `<tr><th>${headers[i]}</th><td>${row[i] || '―'}</td></tr>`;
            }
            backEl.innerHTML = tableHtml + '</table>';

        } else if (currentMode === 'adj') {
            // ── 3. 形容詞カード ──
            frontEl.classList.add('adj-front');
            backEl.classList.add('adj-back');
            frontEl.innerHTML = row.slice(0, 4).filter(Boolean).join('<br>') + '<br><span class="card-hint">タップで答えを確認</span>';
            backEl.innerHTML  = row.slice(4).filter(Boolean).join('<br>') || '（裏面データなし）';

        } else if (currentMode === 'example') {
            // ── 4. 例文カード: A〜C列を表面、J列（index 9）だけを裏面 ──
            frontEl.classList.add('example-front');
            backEl.classList.add('example-back');
            frontEl.innerHTML = row.slice(0, 3).filter(Boolean).join('<br>') + '<br><span class="card-hint">タップで答えを確認</span>';
            backEl.innerHTML  = row[9] || '（裏面データなし）';
        }

        localStorage.setItem(`pos_${currentMode}`, currentIndex);
    }

    function nextCard() {
        if (currentIndex < dataStore[currentMode].length - 1) { currentIndex++; renderCard(); }
    }
    function prevCard() {
        if (currentIndex > 1) { currentIndex--; renderCard(); }
    }

    // ── 5. クイズ ──
    async function openQuiz() {
        showScreen('quiz-screen');
        await fetchData('verb');
        if (dataStore.verb.length <= 1) {
            document.getElementById('quiz-question').innerHTML = '<span class="error-msg">データの読み込みに失敗しました。</span>';
            return;
        }
        quizWaitingNext = false;
        newQuiz();
    }

    function newQuiz() {
        const pool = dataStore.verb.slice(1);
        currentQuizItem = pool[Math.floor(Math.random() * pool.length)];
        const headers = dataStore.verb[0];
        quizColIdx = Math.floor(Math.random() * (currentQuizItem.length - 4)) + 4;
        const formName = headers[quizColIdx] || 'その';
        document.getElementById('quiz-question').innerHTML =
            `「${currentQuizItem[0]}（${currentQuizItem[1]}）」の<br><strong>${formName}</strong> のかたちは？`;
        document.getElementById('quiz-answer').value = '';
        document.getElementById('quiz-feedback').innerText = '';
        document.getElementById('quiz-answer-reveal').innerText = '';
        document.getElementById('quiz-answer').disabled = false;
        document.getElementById('quiz-answer').focus();
        quizWaitingNext = false;
    }

    function checkAnswer() {
        if (quizWaitingNext) { newQuiz(); return; }
        const userAns = document.getElementById('quiz-answer').value.trim();
        if (!userAns) return;
        const feedback = document.getElementById('quiz-feedback');
        const reveal   = document.getElementById('quiz-answer-reveal');
        const isCorrect = currentQuizItem.some((val, idx) => idx >= 4 && val.trim() === userAns);
        const submitBtn = document.querySelector('#quiz-screen .btn:not(.btn-sub)');

        if (isCorrect) {
            feedback.style.color = 'var(--primary)';
            feedback.innerText = '✅ 正解！';
            reveal.innerText = '';
            document.getElementById('quiz-answer').disabled = true;
            setTimeout(newQuiz, 1000);
        } else {
            feedback.style.color = '#ff4b4b';
            feedback.innerText = '❌ ちがうよ！';
            reveal.innerText = `正解：${currentQuizItem[quizColIdx]}`;
            document.getElementById('quiz-answer').disabled = true;
            quizWaitingNext = true;
            submitBtn.innerText = '次の問題へ →';
        }
        if (isCorrect) {
            setTimeout(() => { submitBtn.innerText = '答え合わせ'; }, 1000);
        }
    }

    // ── 6. 動詞エクスプローラー ──
    // verbシートの確定済みヘッダー構成（A〜N列）:
    // ID, 辞書形, ふりがな, グループ, 英語の意味(English), 意味（ベトナム語等の参考用）,
    // 語幹, ない形, ます形, 辞書形, 条件形, 意向形, て形, た形
    // ※explorer専用シートのヘッダー名は実際には未確認のため、複数のヒント候補で柔軟に判定する
    const EXPLORER_KEY_COLUMN_HINTS = ["辞書形", "見出し語", "動詞"];
    const EXPLORER_GROUP_COLUMN_HINTS = ["グループ", "活用グループ", "種類"];
    const EXPLORER_STEM_COLUMN_HINTS = ["語幹"];
    // プロパティ（上部ピッカー）として表示する列：辞書形・ふりがな・グループ・英語の意味・参考意味
    const EXPLORER_PROPERTY_COLUMN_HINTS = ["辞書形", "見出し語", "動詞", "ふりがな", "読み", "グループ", "活用グループ", "種類", "英語の意味", "意味"];
    // 活用形（下部カード）として表示する列：ない形・ます形・辞書形(活用形側)・条件形・意向形・て形・た形
    const EXPLORER_CONJUGATION_HINTS = ["形", "活用"];

    let explorerColumns = [];          // ヘッダー名の配列（重複あり得る）
    let explorerKeyColIdx = -1;        // 辞書形（見出し語として使う：最初に出てくる方）
    let explorerGroupColIdx = -1;      // グループ
    let explorerStemColIdx = -1;       // 語幹
    let explorerPropertyColIdxs = [];  // 上部ピッカー対象の列インデックス
    let explorerConjugationColIdxs = []; // 下部カード対象の列インデックス
    let explorerInitialized = false;

    // シートに語幹列が無い、または値が空の場合のフォールバック自動計算
    // （元のv-sync実装のロジックを継承）
    function explorerComputeFallbackStem(row) {
        const dictWord = explorerKeyColIdx !== -1 && row[explorerKeyColIdx] ? row[explorerKeyColIdx].trim() : '';
        const groupNum = explorerGroupColIdx !== -1 && row[explorerGroupColIdx] ? parseInt(row[explorerGroupColIdx], 10) : 1;
        if (!dictWord) return '';
        if (groupNum === 3) {
            if (dictWord === 'する' || dictWord === 'くる' || dictWord === '来る') return '';
            if (dictWord.endsWith('する') || dictWord.endsWith('くる') || dictWord.endsWith('来る')) return dictWord.slice(0, -2);
        }
        return dictWord.length > 1 ? dictWord.slice(0, -1) : dictWord;
    }

    async function openExplorer() {
        showScreen('explorer-screen');
        if (explorerInitialized) return; // 一度構築したら再利用（explorerデータはdataStoreにキャッシュ済み）

        const data = await fetchData('explorer');
        if (data.length <= 1) {
            explorerShowFatalError('動詞データの読み込みに失敗しました。ネットワーク接続を確認してください。');
            return;
        }
        explorerResolveColumns(data[0]);
        explorerInitPickers(data);
        explorerUpdateData(1); // 最初の動詞（ヘッダーの次の行）を表示
        explorerInitialized = true;
    }

    function explorerShowFatalError(message) {
        const container = document.getElementById('explorer-pickers-container');
        if (container) {
            container.innerHTML = `<div class="explorer-error">⚠ ${message}</div>`;
        }
        const scroller = document.getElementById('explorer-cards-scroller');
        if (scroller) scroller.innerHTML = '';
    }

    // ヘッダー名（文字列配列）から各列の役割をインデックスとして解決する。
    // 「辞書形」はB列とJ列の2か所に存在するため、最初に見つかった方を見出し語キーとして使う。
    function explorerResolveColumns(headerRow) {
        explorerColumns = headerRow;

        explorerKeyColIdx = explorerColumns.findIndex(c => EXPLORER_KEY_COLUMN_HINTS.some(h => c.includes(h)));
        explorerGroupColIdx = explorerColumns.findIndex(c => EXPLORER_GROUP_COLUMN_HINTS.some(h => c.includes(h)));
        explorerStemColIdx = explorerColumns.findIndex(c => EXPLORER_STEM_COLUMN_HINTS.some(h => c.includes(h)));

        if (explorerKeyColIdx === -1) {
            console.warn('「辞書形」列が見つかりません。フォールバックでB列(index1)を使用します。');
            explorerKeyColIdx = 1;
        }
        if (explorerStemColIdx === -1) {
            console.warn('「語幹」列が見つかりません。語幹表示は空欄になります。');
        }

        // プロパティ列：ヒントに一致する列のうち、ID列(0)は除外。
        // 「辞書形」はB列・J列の2か所に存在するが、見出し語として使う最初の出現（=explorerKeyColIdx）
        // のみをプロパティ扱いにし、2回目以降の「辞書形」(J列)は活用形セクション側に回す。
        explorerPropertyColIdxs = explorerColumns
            .map((c, idx) => ({ c, idx }))
            .filter(({ c, idx }) => {
                if (idx === 0) return false;
                if (c.includes('辞書形')) return idx === explorerKeyColIdx;
                return EXPLORER_PROPERTY_COLUMN_HINTS.some(h => c.includes(h));
            })
            .map(({ idx }) => idx);

        // 活用形列：見出しに「形」を含み、かつプロパティ列に含まれていない列
        // （「ない形」「ます形」「辞書形」(J列)「条件形」「意向形」「て形」「た形」が該当）
        explorerConjugationColIdxs = explorerColumns
            .map((c, idx) => ({ c, idx }))
            .filter(({ c, idx }) =>
                EXPLORER_CONJUGATION_HINTS.some(h => c.includes(h)) &&
                idx !== explorerStemColIdx &&
                !explorerPropertyColIdxs.includes(idx)
            )
            .map(({ idx }) => idx);

        if (explorerConjugationColIdxs.length === 0) {
            console.warn('活用形セクションに該当する列が見つかりませんでした。');
        }
    }

    // 上部ピッカー群を生成。各ドロップダウンの選択肢は「行インデックス」をvalueに持つ。
    function explorerInitPickers(data) {
        const container = document.getElementById('explorer-pickers-container');
        container.innerHTML = '';

        if (explorerPropertyColIdxs.length === 0) {
            container.innerHTML = '<div class="explorer-error">⚠ 表示できる動詞プロパティ列が見つかりませんでした。</div>';
            return;
        }

        const headerRow = data[0];
        const dataRows = data.slice(1);

        explorerPropertyColIdxs.forEach(colIdx => {
            const columnName = headerRow[colIdx];

            const groupDiv = document.createElement('div');
            groupDiv.className = 'explorer-picker-group';

            const label = document.createElement('label');
            label.className = 'explorer-picker-label';
            label.innerText = columnName;

            const select = document.createElement('select');
            select.dataset.colIdx = colIdx;
            select.className = 'explorer-select';

            select.addEventListener('change', function(e) {
                explorerUpdateData(parseInt(e.target.value, 10));
            });

            dataRows.forEach((row, i) => {
                const rowIndex = i + 1; // dataStore.explorer 内の実インデックス（ヘッダー分+1）
                const cellValue = row[colIdx];
                if (cellValue !== undefined && cellValue !== null && cellValue.trim() !== '') {
                    const opt = document.createElement('option');
                    opt.value = rowIndex;
                    opt.innerText = cellValue.trim();
                    select.appendChild(opt);
                }
            });

            groupDiv.appendChild(label);
            groupDiv.appendChild(select);
            container.appendChild(groupDiv);
        });
    }

    // 全ピッカー・活用形カードをターゲット行に同期する
    function explorerUpdateData(rowIndex) {
        const data = dataStore.explorer;
        if (rowIndex < 1 || rowIndex >= data.length) return;
        const row = data[rowIndex];

        // ① 全ピッカーの選択位置を同期
        document.querySelectorAll('#explorer-pickers-container .explorer-select').forEach(select => {
            select.value = rowIndex;
        });

        // ② 語幹を算出。シートの語幹列に値があればそれを優先し、
        //    空欄の場合のみ辞書形＋グループから自動計算したフォールバック値を使う。
        let stemValue = (explorerStemColIdx !== -1 && row[explorerStemColIdx]) ? row[explorerStemColIdx].trim() : '';
        if (stemValue === '') stemValue = explorerComputeFallbackStem(row);

        // ③ 活用形カードを縦並びで生成。各カードの左端に語幹を固定表示し、
        //    右側にその活用形のラベルと「語幹に続く部分」を表示することで、
        //    視線が「語幹 → 活用形」と自然に左から右へ流れるようにする。
        const scroller = document.getElementById('explorer-cards-scroller');
        scroller.innerHTML = '';

        if (explorerConjugationColIdxs.length === 0) {
            scroller.innerHTML = '<div class="explorer-error">⚠ 表示できる活用形列が見つかりませんでした。</div>';
            return;
        }

        explorerConjugationColIdxs.forEach(colIdx => {
            const columnName = explorerColumns[colIdx];
            const cellValue = row[colIdx];
            const fullValue = (cellValue !== undefined && cellValue !== null && cellValue.trim() !== '') ? cellValue.trim() : '';

            const cardDiv = document.createElement('div');
            cardDiv.className = 'explorer-card';

            // 左端：語幹を固定表示（カードごとに繰り返し表示することで「ここから始まる」ことを強調）
            const stemBlock = document.createElement('div');
            stemBlock.className = 'explorer-card-stem';
            stemBlock.innerText = stemValue === '' ? '-' : stemValue;
            cardDiv.appendChild(stemBlock);

            // 右側：ラベルと値（値は語幹部分を除いた続きだけをハイライト色で表示）
            const bodyDiv = document.createElement('div');
            bodyDiv.className = 'explorer-card-body';

            const cardLabel = document.createElement('div');
            cardLabel.className = 'explorer-card-label';
            cardLabel.innerText = columnName;
            bodyDiv.appendChild(cardLabel);

            const cardValue = document.createElement('div');
            cardValue.className = 'explorer-card-value';

            if (fullValue === '') {
                cardValue.innerText = '---';
            } else if (stemValue !== '' && fullValue.startsWith(stemValue) && fullValue.length > stemValue.length) {
                // 語幹に続く活用語尾の部分だけを表示する（語幹は左端ブロックに既に出ているため重複させない）
                const suffixSpan = document.createElement('span');
                suffixSpan.className = 'explorer-suffix-part';
                suffixSpan.innerText = fullValue.slice(stemValue.length);
                cardValue.appendChild(suffixSpan);
            } else {
                // 語幹と一致しない（不規則活用など）場合は活用形全体をそのまま表示
                cardValue.innerText = fullValue;
            }

            bodyDiv.appendChild(cardValue);
            cardDiv.appendChild(bodyDiv);
            scroller.appendChild(cardDiv);
        });

        scroller.scrollTop = 0;
    }
</script>
