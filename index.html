<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本語活用マスター</title>
    <style>
        :root {
            --primary: #58cc02; --dark-green: #46a302; --bg: #ffffff; --text: #4b4b4b;
            --card-bg: #ffffff; --border: #e5e5e5; --accent: #1cb0f6;
        }
        [data-theme="dark"] {
            --primary: #58cc02; --dark-green: #46a302; --bg: #131f24; --text: #eeeeee;
            --card-bg: #202f36; --border: #3c4d54; --accent: #1cb0f6;
        }

        body {
            margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f0f0; color: var(--text);
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh; transition: background-color 0.3s, color 0.3s;
        }

        #app {
            width: 100%; max-width: 500px; min-height: 100vh;
            display: flex; flex-direction: column;
            background-color: var(--bg); color: var(--text);
            transition: background-color 0.3s, color 0.3s;
            box-shadow: 0 0 30px rgba(0,0,0,0.12);
        }

        .header {
            padding: 15px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--border);
            background-color: var(--bg); color: var(--text);
            flex-shrink: 0;
        }
        .header-title { font-weight: bold; font-size: 16px; color: var(--text); }

        .screen {
            display: none; flex-direction: column; flex: 1;
            padding: 16px; box-sizing: border-box; overflow-y: auto;
            background-color: var(--bg); color: var(--text);
        }
        .active { display: flex; }

        /* ボタン */
        .btn {
            background: var(--primary); color: white; border: none; border-bottom: 4px solid var(--dark-green);
            padding: 15px; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer;
            margin-bottom: 15px; text-align: center; display: block; width: 100%; box-sizing: border-box;
        }
        .btn:active { transform: translateY(2px); border-bottom-width: 2px; }
        .btn-blue { background: var(--accent); border-bottom-color: #1899d6; }
        .btn-sub {
            background: var(--card-bg); border: 2px solid var(--border); border-bottom-width: 2px;
            color: var(--text);
        }

        /* ── 1. 活用システム ── */
        .table-container {
            overflow-x: auto; overflow-y: auto;
            border: 1px solid var(--border); border-radius: 10px; margin-bottom: 15px;
            flex: 1;
        }
        /* 説明列（2列目以降のテキスト）は2〜3行で折り返す */
        table { border-collapse: collapse; width: 100%; }
        th, td {
            border: 1px solid var(--border);
            padding: 5px 5px; text-align: center;
            background-color: var(--card-bg); color: var(--text);
            font-size: 13px;          /* ★字を大きく */
            white-space: normal;      /* ★折り返しON → 列幅が狭くなる */
            word-break: break-all;
            max-width: 70px;          /* ★各列の最大幅を制限 */
            line-height: 1.4;
        }
        th { background-color: var(--primary); color: white; font-weight: bold; white-space: nowrap; }

        /* ── フラッシュカード共通 ── */
        .card-container {
            perspective: 1000px;
            height: 360px;
            margin: 12px 0;
            flex-shrink: 0;
        }
        .card {
            width: 100%; height: 100%; position: relative;
            transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer;
        }
        .card.is-flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 2px solid var(--border); border-radius: 25px;
            background-color: var(--card-bg); color: var(--text);
            padding: 20px; box-sizing: border-box;
            box-shadow: 0 4px 0 var(--border);
            text-align: center; overflow: hidden;
        }
        /* ── 2. 動詞カード ── */
        .verb-front { font-size: clamp(20px, 6vw, 28px); }   /* ★大きく */
        /* 裏面 */
        .card-back {
            transform: rotateY(180deg);
            overflow-y: auto;
            justify-content: flex-start;
            padding-top: 14px;
            font-size: 14px;
        }

        /* 動詞カード裏面テーブル（縦並び） */
        .back-table { width: 100%; border-collapse: collapse; }
        .back-table th {
            background-color: var(--primary); color: white;
            padding: 7px 10px; font-size: 13px; white-space: nowrap;
            border: 1px solid var(--dark-green);
            text-align: left; width: 45%;
        }
        .back-table td {
            padding: 7px 10px; border: 1px solid var(--border);
            font-size: 16px; font-weight: bold; text-align: left;  /* ★大きく */
        }

        /* ── 3. 形容詞カード ── */
        .adj-front { font-size: clamp(20px, 6vw, 28px); }    /* ★大きく */
        .adj-back  { font-size: clamp(16px, 5vw, 22px); justify-content: center; }  /* ★大きく */

        /* ── 4. 例文カード ── */
        .example-front { font-size: clamp(18px, 5.5vw, 26px); }  /* ★大きく */
        .example-back  { font-size: clamp(16px, 5vw, 24px); justify-content: center; } /* ★大きく */

        .card-hint { font-size: 12px; color: #aaa; margin-top: 10px; }

        /* ── 5. クイズ ── */
        #quiz-q-container {
            min-height: 120px; margin-bottom: 6px;   /* ★margin小さく */
            border: 2px solid var(--border); border-radius: 25px;
            background-color: var(--card-bg); color: var(--text);
            display: flex; align-items: center; justify-content: center;
            padding: 16px; box-sizing: border-box; text-align: center;
            box-shadow: 0 4px 0 var(--border); font-size: 18px;
            flex-shrink: 0;
        }
        #quiz-feedback {
            font-weight: bold; font-size: 20px;
            margin: 4px 0; height: 26px; text-align: center;  /* ★margin削減 */
        }
        #quiz-answer-reveal {
            font-size: 15px; color: #ff4b4b;
            margin-bottom: 4px; min-height: 20px;             /* ★margin削減 */
            text-align: center; font-weight: bold;
        }
        .quiz-input {
            width: 100%; padding: 12px; border-radius: 15px; border: 2px solid var(--border);
            margin-bottom: 8px; font-size: 18px; box-sizing: border-box;
            background-color: var(--card-bg); color: var(--text);
        }
        .quiz-input:focus { outline: none; border-color: var(--primary); }

        .nav-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .mode-toggle {
            font-size: 12px; cursor: pointer; padding: 5px 10px;
            border: 1px solid var(--border); border-radius: 10px;
            background-color: var(--card-bg); color: var(--text);
            transition: background-color 0.3s, color 0.3s;
        }
        .error-msg { color: #ff4b4b; text-align: center; padding: 20px; }
    </style>
</head>
<body>
<div id="app">
    <div class="header">
        <span class="header-title" id="screen-title">日本語活用マスター</span>
        <button class="mode-toggle" onclick="toggleDarkMode()">🌙 Dark / Light</button>
    </div>

    <!-- トップ画面 -->
    <div id="top-screen" class="screen active">
        <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
            <button class="btn" onclick="openConjugation()">📋 活用システム</button>
            <button class="btn btn-blue" onclick="openFlashcard('verb')">📘 動詞カード</button>
            <button class="btn btn-blue" onclick="openFlashcard('adj')">📗 形容詞カード</button>
            <button class="btn" style="background:#a560e8; border-color:#8848c8" onclick="openFlashcard('example')">📝 例文カード</button>
            <button class="btn" style="background:#ffc800; border-color:#e5a500; color:#333;" onclick="openQuiz()">🎯 クイズ</button>
        </div>
    </div>

    <!-- 活用表画面 -->
    <div id="table-screen" class="screen">
        <div class="table-container" id="table-content">読み込み中...</div>
        <button class="btn btn-sub" style="flex-shrink:0" onclick="showScreen('top-screen')">← 戻る</button>
    </div>

    <!-- フラッシュカード画面 -->
    <div id="card-screen" class="screen">
        <div style="text-align:center; font-size:13px; color:#aaa;" id="card-progress"></div>
        <div class="card-container">
            <div id="main-card" class="card" onclick="this.classList.toggle('is-flipped')">
                <div class="card-face card-front" id="card-front-content">
                    <span class="card-hint">読み込み中...</span>
                </div>
                <div class="card-face card-back" id="card-back-content"></div>
            </div>
        </div>
        <div class="nav-controls">
            <button class="btn btn-sub" onclick="prevCard()">← まえへ</button>
            <button class="btn btn-sub" onclick="nextCard()">つぎへ →</button>
        </div>
        <button class="btn btn-sub" onclick="showScreen('top-screen')">← トップへ戻る</button>
    </div>

    <!-- クイズ画面 -->
    <div id="quiz-screen" class="screen">
        <div id="quiz-q-container"><div id="quiz-question"></div></div>
        <div id="quiz-feedback"></div>
        <div id="quiz-answer-reveal"></div>
        <input type="text" id="quiz-answer" class="quiz-input" placeholder="答えを入力..."
               onkeydown="if(event.key==='Enter') checkAnswer()">
        <button class="btn" onclick="checkAnswer()">答え合わせ</button>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-sub" style="flex:1" onclick="openConjugation()">📋 活用表</button>
            <button class="btn btn-sub" style="flex:1" onclick="showScreen('top-screen')">← 戻る</button>
        </div>
    </div>
</div>

<script>
    const URLS = {
        system:  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTDRPlyoBQrG9wzUadhnR8OY9sxuPhkRRpO_WO0BNs-H_f349__5bK5vN6ZYb3U_w/pub?gid=1804971889&single=true&output=csv",
        verb:    "https://docs.google.com/spreadsheets/d/e/2PACX-1vTDRPlyoBQrG9wzUadhnR8OY9sxuPhkRRpO_WO0BNs-H_f349__5bK5vN6ZYb3U_w/pub?gid=257174721&single=true&output=csv",
        adj:     "https://docs.google.com/spreadsheets/d/e/2PACX-1vTDRPlyoBQrG9wzUadhnR8OY9sxuPhkRRpO_WO0BNs-H_f349__5bK5vN6ZYb3U_w/pub?gid=1428601861&single=true&output=csv",
        example: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTDRPlyoBQrG9wzUadhnR8OY9sxuPhkRRpO_WO0BNs-H_f349__5bK5vN6ZYb3U_w/pub?gid=2070601702&single=true&output=csv"
    };

    let dataStore = { system: [], verb: [], adj: [], example: [] };
    let currentMode = '';
    let currentIndex = 0;
    let currentQuizItem = null;
    let quizColIdx = 4;
    let quizWaitingNext = false;

    function parseCSV(text) {
        const rows = [];
        let row = [], cell = '', inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            const ch = text[i], next = text[i + 1];
            if (inQuotes) {
                if (ch === '"' && next === '"') { cell += '"'; i++; }
                else if (ch === '"') { inQuotes = false; }
                else { cell += ch; }
            } else {
                if (ch === '"') { inQuotes = true; }
                else if (ch === ',') { row.push(cell.trim()); cell = ''; }
                else if (ch === '\n' || (ch === '\r' && next === '\n')) {
                    if (ch === '\r') i++;
                    row.push(cell.trim()); cell = '';
                    if (row.some(c => c !== '')) rows.push(row);
                    row = [];
                } else if (ch === '\r') {
                    row.push(cell.trim()); cell = '';
                    if (row.some(c => c !== '')) rows.push(row);
                    row = [];
                } else { cell += ch; }
            }
        }
        if (cell !== '' || row.length > 0) {
            row.push(cell.trim());
            if (row.some(c => c !== '')) rows.push(row);
        }
        return rows;
    }

    async function fetchData(key) {
        if (dataStore[key].length > 0) return dataStore[key];
        try {
            const res = await fetch(URLS[key]);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            dataStore[key] = parseCSV(await res.text());
            return dataStore[key];
        } catch (e) {
            console.error(`fetchData(${key}) failed:`, e);
            return [];
        }
    }

    const SCREEN_TITLES = {
        'top-screen':   '日本語活用マスター',
        'table-screen': '📋 活用システム',
        'card-screen':  '📘 フラッシュカード',
        'quiz-screen':  '🎯 クイズ'
    };

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('screen-title').innerText = SCREEN_TITLES[id] || id;
    }

    function toggleDarkMode() {
        const html = document.documentElement;
        html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }

    // ── 1. 活用システム ──
    async function openConjugation() {
        showScreen('table-screen');
        const data = await fetchData('system');
        if (data.length === 0) {
            document.getElementById('table-content').innerHTML = '<p class="error-msg">データの読み込みに失敗しました。</p>';
            return;
        }
        const colCount = data[0].filter(c => c !== '').length || 7;
        let html = '<table>';
        data.forEach((row, i) => {
            html += '<tr>';
            for (let j = 0; j < colCount; j++) {
                const cell = (row[j] || '').replace(/\+/g, '<br>+');
                html += i === 0 ? `<th>${cell}</th>` : `<td>${cell}</td>`;
            }
            html += '</tr>';
        });
        document.getElementById('table-content').innerHTML = html + '</table>';
    }

    // ── フラッシュカード共通 ──
    async function openFlashcard(mode) {
        currentMode = mode;
        showScreen('card-screen');
        document.getElementById('card-front-content').innerHTML = '読み込み中...';
        document.getElementById('card-back-content').innerHTML = '';
        const data = await fetchData(mode);
        if (data.length <= 1) {
            document.getElementById('card-front-content').innerHTML = '<span class="error-msg">データがありません</span>';
            return;
        }
        currentIndex = parseInt(localStorage.getItem(`pos_${mode}`)) || 1;
        if (currentIndex >= data.length) currentIndex = 1;
        renderCard();
    }

    function renderCard() {
        const data = dataStore[currentMode];
        if (!data || !data[currentIndex]) {
            document.getElementById('card-front-content').innerHTML = '<span class="error-msg">カードが見つかりません</span>';
            return;
        }
        const row = data[currentIndex];
        document.getElementById('main-card').classList.remove('is-flipped');
        document.getElementById('card-progress').innerText = `${currentIndex} / ${data.length - 1}`;

        const frontEl = document.getElementById('card-front-content');
        const backEl  = document.getElementById('card-back-content');

        // クラスをリセット
        frontEl.className = 'card-face card-front';
        backEl.className  = 'card-face card-back';

        if (currentMode === 'verb') {
            // ── 2. 動詞カード ──
            frontEl.classList.add('verb-front');
            frontEl.innerHTML = row.slice(0, 4).filter(Boolean).join('<br>') + '<br><span class="card-hint">タップで答えを確認</span>';

            // 裏面: E〜L列（index 4〜11）縦並びテーブル
            const headers = data[0];
            let tableHtml = '<table class="back-table">';
            for (let i = 4; i <= 11 && i < headers.length; i++) {
                if (!headers[i]) continue;
                tableHtml += `<tr><th>${headers[i]}</th><td>${row[i] || '―'}</td></tr>`;
            }
            backEl.innerHTML = tableHtml + '</table>';

        } else if (currentMode === 'adj') {
            // ── 3. 形容詞カード ──
            frontEl.classList.add('adj-front');
            backEl.classList.add('adj-back');
            frontEl.innerHTML = row.slice(0, 4).filter(Boolean).join('<br>') + '<br><span class="card-hint">タップで答えを確認</span>';
            backEl.innerHTML  = row.slice(4).filter(Boolean).join('<br>') || '（裏面データなし）';

        } else if (currentMode === 'example') {
            // ── 4. 例文カード: A〜C列を表面、J列（index 9）だけを裏面 ──
            frontEl.classList.add('example-front');
            backEl.classList.add('example-back');
            frontEl.innerHTML = row.slice(0, 3).filter(Boolean).join('<br>') + '<br><span class="card-hint">タップで答えを確認</span>';
            backEl.innerHTML  = row[9] || '（裏面データなし）';
        }

        localStorage.setItem(`pos_${currentMode}`, currentIndex);
    }

    function nextCard() {
        if (currentIndex < dataStore[currentMode].length - 1) { currentIndex++; renderCard(); }
    }
    function prevCard() {
        if (currentIndex > 1) { currentIndex--; renderCard(); }
    }

    // ── 5. クイズ ──
    async function openQuiz() {
        showScreen('quiz-screen');
        await fetchData('verb');
        if (dataStore.verb.length <= 1) {
            document.getElementById('quiz-question').innerHTML = '<span class="error-msg">データの読み込みに失敗しました。</span>';
            return;
        }
        quizWaitingNext = false;
        newQuiz();
    }

    function newQuiz() {
        const pool = dataStore.verb.slice(1);
        currentQuizItem = pool[Math.floor(Math.random() * pool.length)];
        const headers = dataStore.verb[0];
        quizColIdx = Math.floor(Math.random() * (currentQuizItem.length - 4)) + 4;
        const formName = headers[quizColIdx] || 'その';
        document.getElementById('quiz-question').innerHTML =
            `「${currentQuizItem[0]}（${currentQuizItem[1]}）」の<br><strong>${formName}</strong> のかたちは？`;
        document.getElementById('quiz-answer').value = '';
        document.getElementById('quiz-feedback').innerText = '';
        document.getElementById('quiz-answer-reveal').innerText = '';
        document.getElementById('quiz-answer').disabled = false;
        document.getElementById('quiz-answer').focus();
        quizWaitingNext = false;
    }

    function checkAnswer() {
        if (quizWaitingNext) { newQuiz(); return; }
        const userAns = document.getElementById('quiz-answer').value.trim();
        if (!userAns) return;
        const feedback = document.getElementById('quiz-feedback');
        const reveal   = document.getElementById('quiz-answer-reveal');
        const isCorrect = currentQuizItem.some((val, idx) => idx >= 4 && val.trim() === userAns);
        const submitBtn = document.querySelector('#quiz-screen .btn:not(.btn-sub)');

        if (isCorrect) {
            feedback.style.color = 'var(--primary)';
            feedback.innerText = '✅ 正解！';
            reveal.innerText = '';
            document.getElementById('quiz-answer').disabled = true;
            setTimeout(newQuiz, 1000);
        } else {
            feedback.style.color = '#ff4b4b';
            feedback.innerText = '❌ ちがうよ！';
            reveal.innerText = `正解：${currentQuizItem[quizColIdx]}`;
            document.getElementById('quiz-answer').disabled = true;
            quizWaitingNext = true;
            submitBtn.innerText = '次の問題へ →';
        }
        if (isCorrect) {
            setTimeout(() => { submitBtn.innerText = '答え合わせ'; }, 1000);
        }
    }
</script>
</body>
</html>
